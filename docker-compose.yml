services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: california_commerce, POSTGRES_USER: cc, POSTGRES_PASSWORD: cc_lab_only}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U cc -d california_commerce"], interval: 3s, timeout: 3s, retries: 15}
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cc:cc_lab_only@db:5432/california_commerce
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: cc-lab-jwt-secret
      LAB_MODE: "true"
      DEBUG: "true"
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    build: ./worker
    environment: {REDIS_URL: redis://redis:6379/0}
    depends_on: [redis]
  web:
    build: ./frontend
    depends_on: [api]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web, api]
volumes: {dbdata: {}, uploads: {}}
